<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengalihkan ke Portal Lomba Novela — PT Media Tulisan Manusia</title>
    
    <!-- 1. Redirect Instan via Meta Refresh (Cadangan jika JS mati) -->
    <meta http-equiv="refresh" content="0; url=https://lomba.mediatulisanmanusia.com">
    
    <!-- Canonical agar Google SEO juga tahu halaman pindah ke subdomain baru -->
    <link rel="canonical" href="https://lomba.mediatulisanmanusia.com">
    <link rel="icon" type="image/png" href="logo.png">

    <!-- 2. Redirect Instan via JavaScript (Paling Cepat & Meneruskan Parameter URL) -->
    <script>
        (function() {
            var targetUrl = "https://lomba.mediatulisanmanusia.com";
            // Jika ada parameter tambahan seperti ?ref=... ikut diteruskan
            var query = window.location.search || "";
            var hash = window.location.hash || "";
            window.location.replace(targetUrl + query + hash);
        })();
    </script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #0c0d10;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        .loader {
            width: 38px;
            height: 38px;
            border: 4px solid #c59b27;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #e5c158;
            font-weight: 700;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p style="font-size: 13px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin: 0;">
        Mengalihkan ke Portal Lomba Novela...
    </p>
    <p style="font-size: 11px; color: #94a3b8; margin-top: 8px;">
        Jika halaman tidak berpindah otomatis, <a href="https://lomba.mediatulisanmanusia.com">klik di sini</a>.
    </p>
</body>
</html>
