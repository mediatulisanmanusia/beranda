<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#07192C">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07192C">
    <title>Pelaporan Closing Klien - Media Tulisan Manusia</title>
    <link rel="icon" type="image/png" href="rev.png?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { warnautama: '#0A2540', warnakedua: '#D4AF37', warnaketiga: '#0A3F61', warnakeempat: '#1B1B1B' },
                    animation: { 'fade-up': 'fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards', pulse: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' },
                    keyframes: { fadeUp: { '0%': { opacity: '0', transform: 'translateY(30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } }
                }
            }
        }
    </script>
    <style>
        body { transition: background-color 0.5s ease, color 0.5s ease; overflow-x: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;}
        input, select, textarea, button { -webkit-appearance: none; appearance: none; }
        
        .bg-custom-gradient { background: linear-gradient(135deg, #ffffff 0%, #f4f4f5 50%, #e4e4e7 100%); }
        .dark .bg-custom-gradient { background: linear-gradient(135deg, #1b1b1b 0%, #181818 50%, #151515 100%); }
        
        .glass { 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(245, 245, 250, 0.8) 100%); 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            box-shadow: 0 15px 40px -10px rgba(0, 0, 0, 0.15), inset 0 -8px 25px -5px rgba(0, 0, 0, 0.1); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass { background: linear-gradient(135deg, rgba(25, 25, 28, 0.85) 0%, rgba(10, 10, 12, 0.8) 100%); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 15px 45px -10px rgba(0, 0, 0, 0.95), inset 0 -8px 25px -5px rgba(0, 0, 0, 0.75); }
        
        header.glass { background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(245, 245, 250, 0.7) 100%); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .dark header.glass { background: linear-gradient(135deg, rgba(25, 25, 28, 0.85) 0%, rgba(10, 10, 12, 0.65) 100%); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        
        .bubble-container { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bubble { 
            position: absolute; bottom: -100px; 
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.2) 60%, rgba(255,255,255,0.05) 100%); 
            border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; 
            animation: floatUp 15s infinite linear; 
            -webkit-transform: translate3d(0,0,0);
        }
        .dark .bubble { background: radial-gradient(circle at 30% 30%, rgba(10,37,64,0.6), rgba(10,37,64,0.2) 60%, rgba(10,37,64,0.05) 100%); border: 1px solid rgba(10,37,64,0.4); }
        
        @keyframes floatUp { 0% { transform: translate3d(0, 110vh, 0) scale(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate3d(0, -10vh, 0) scale(1.5); opacity: 0; } }
        
        /* Styling untuk Option Dropdown agar menyesuaikan tema */
        select option {
            background-color: #ffffff;
            color: #0A2540;
            font-weight: 500;
        }
        .dark select option {
            background-color: #1b1b1b;
            color: #ffffff;
        }

        /* Panah Custom Dropdown */
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: "▼";
            font-size: 10px;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: inherit;
        }

        #toast-container { z-index: 999999; }
    </style>
</head>
<body class="bg-gray-100 text-warnautama dark:text-white font-sans transition-colors duration-500 bg-custom-gradient relative min-h-screen">
    
    <div id="toast-container" class="fixed top-6 left-1/2 transform -translate-x-1/2 flex flex-col gap-3 pointer-events-none w-11/12 max-w-sm"></div>
    
    <div id="loading-form" class="fixed inset-0 z-[99999] bg-white/80 dark:bg-black/80 flex items-center justify-center transition-opacity duration-500 hidden opacity-0 backdrop-blur-sm">

    <div class="fixed top-10 -left-10 w-96 h-96 rounded-full pointer-events-none z-0 hidden dark:block" style="background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%);"></div>

            <img src="rev2.png" alt="Logo MTM" class="h-10 sm:h-12 md:h-14 w-auto max-w-[180px] sm:max-w-[280px] object-contain hidden dark:block">

        <div class="flex items-center gap-2 relative">
            <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-full hover:bg-black/10 dark:hover:bg-white/10 transition text-warnakedua dark:text-gray-200">
                <svg class="w-6 h-6 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                <svg class="w-6 h-6 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>

    <main class="max-w-4xl mx-auto px-4 md:px-6 relative z-10 pb-20">

                <!-- BAGIAN DATA MITRA -->

                    <h3 class="text-sm font-black text-warnakedua uppercase tracking-widest mb-4 border-l-4 border-warnakedua pl-3">DATA MITRA (FREELANCE)</h3>

                        <div>

                            <input type="number" id="Nomor_Rekening" name="Nomor_Rekening" required placeholder="CONTOH: 1234567890" class="w-full bg-white/70 dark:bg-black/60 border border-gray-300 dark:border-gray-700 rounded-2xl p-4 text-[16px] font-medium focus:outline-none focus:border-warnautama transition shadow-inner text-warnautama dark:text-white uppercase">
                        </div>
                        <div>
                            <label for="Nama_Pemilik" class="block text-[11px] font-bold text-gray-700 dark:text-gray-300 mb-1 ml-2 uppercase tracking-wider">NAMA PEMILIK (A/N) <span class="text-red-500">*</span></label>
                            <input type="text" id="Nama_Pemilik" name="Nama_Pemilik" required oninput="this.value = this.value.toUpperCase()" placeholder="SESUAI BUKU TABUNGAN" class="w-full bg-white/70 dark:bg-black/60 border border-gray-300 dark:border-gray-700 rounded-2xl p-4 text-[16px] font-medium focus:outline-none focus:border-warnautama transition shadow-inner text-warnautama dark:text-white uppercase">

                <!-- BAGIAN DATA KLIEN -->
                <div class="mb-8">
                    <h3 class="text-sm font-black text-warnakedua uppercase tracking-widest mb-4 border-l-4 border-warnakedua pl-3">DATA KLIEN (YANG SUDAH DEAL)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                            <label for="Nama_Klien_Gelar" class="block text-[11px] font-bold text-gray-700 dark:text-gray-300 mb-1 ml-2 uppercase tracking-wider">NAMA KLIEN & GELAR <span class="text-red-500">*</span></label>

                            <input type="number" id="WhatsApp_Klien" name="WhatsApp_Klien" required placeholder="08XXXXXXXXXX" class="w-full bg-white/70 dark:bg-black/60 border border-gray-300 dark:border-gray-700 rounded-2xl p-4 text-[16px] font-medium focus:outline-none focus:border-warnautama transition shadow-inner text-warnautama dark:text-white uppercase">

                                </select>
                            </div>

                        <div>
                            <label for="Detail_Paket" class="block text-[11px] font-bold text-gray-700 dark:text-gray-300 mb-1 ml-2 uppercase tracking-wider">DETAIL PAKET <span class="text-red-500">*</span></label>
                            <div class="select-wrapper text-warnautama dark:text-white">
                                <select id="Detail_Paket" name="Detail_Paket" required class="w-full bg-white/70 dark:bg-black/60 border border-gray-300 dark:border-gray-700 rounded-2xl p-4 pr-10 text-[16px] font-medium focus:outline-none focus:border-warnautama transition shadow-inner text-inherit appearance-none uppercase cursor-pointer">

                        <div>

    <iframe name="hidden-iframe-upload" id="hidden-iframe-upload" style="display:none;"></iframe>    

    <script>
        // Logika memunculkan kolom ketik manual untuk Bank
        function cekBankLainnya() {
            const pilihan = document.getElementById('Pilihan_Bank').value;
            const inputLainnya = document.getElementById('Nama_Bank_Lainnya');
            
            if (pilihan === 'LAINNYA') {
                inputLainnya.classList.remove('hidden');
                inputLainnya.setAttribute('required', 'true');
            } else {
                inputLainnya.classList.add('hidden');
                inputLainnya.removeAttribute('required');
                inputLainnya.value = '';
            }
        }

        // Logika Dropdown Dinamis untuk Detail Paket
        function updateDetailPaket() {
            const layanan = document.getElementById('Layanan_Diambil').value;
            const detailSelect = document.getElementById('Detail_Paket');
            
            detailSelect.innerHTML = '<option value="" disabled selected>PILIH DETAIL PAKET</option>';
            
            let options = [];
            if (layanan === 'PENERBITAN') {
                options = ['PENERBITAN STANDAR', 'PENERBITAN EKSKLUSIF'];
            } else if (layanan === 'HAK CIPTA') {
                options = ['HAK CIPTA KARYA TULIS', 'HAK CIPTA UMUM'];
            } else if (layanan === 'NIB') {
                options = ['PEMBUATAN NIB'];
            }

            options.forEach(opt => {
                const optionElement = document.createElement('option');
                optionElement.value = opt;
                optionElement.textContent = opt;
                detailSelect.appendChild(optionElement);
            });
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' ? '✅' : '❌';
            toast.className = `${bgColor} text-white px-5 py-3 rounded-full shadow-2xl font-bold text-xs sm:text-sm flex items-center gap-2 transform transition-all duration-300 translate-y-[-30px] opacity-0 w-max max-w-[90vw] mx-auto uppercase`;
            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-[-30px]', 'opacity-0'); toast.classList.add('translate-y-0', 'opacity-100'); }, 10);
            setTimeout(() => { toast.classList.remove('translate-y-0', 'opacity-100'); toast.classList.add('translate-y-[-30px]', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 4000);
        }

        function prosesSukses(loader, form, btn, waLink) {
            if (loader) { loader.classList.add('opacity-0'); setTimeout(() => loader.classList.add('hidden'), 500); }
            showToast("LAPORAN BERHASIL DIKIRIM!", "success");
            window.location.href = waLink; // Pindah ke WA
            
            // Reset form
            setTimeout(() => {
                form.reset();
                document.getElementById('Detail_Paket').innerHTML = '<option value="" disabled selected>PILIH LAYANAN DULU</option>';
                document.getElementById('Nama_Bank_Lainnya').classList.add('hidden');
                btn.disabled = false;
                btn.innerText = "KIRIM LAPORAN CLOSING";
            }, 1500);
        }

        function kirimFormPelaporan(e) {
            e.preventDefault();
            const f = e.target;
            const fileInputs = f.querySelectorAll('input[type="file"]');
            
            for (let i of fileInputs) {
                if (i.files.length > 0) {
                    for (let j = 0; j < i.files.length; j++) {
                        if ((i.files[j].size / 1024 / 1024) > 3) {
                            showToast(`BERKAS KE-${j+1} MELEBIHI 3MB.`, 'error');
                            return;
                        }
                    }
                }
            }

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "MENGUNGGAH...";

            const loader = document.getElementById('loading-form');
            // Ganti teks loading agar user tahu proses sedang mengunggah file
            document.getElementById('loading-text').innerText = "MENGUNGGAH BUKTI INTERAKSI...\nMOHON TUNGGU SEBENTAR";
            
            if (loader) { loader.classList.remove('hidden'); setTimeout(() => loader.classList.remove('opacity-0'), 10); }

            let subjekEl = f.querySelector('input[name="_subject"]');
            if (!subjekEl) {
                subjekEl = document.createElement('input');
                subjekEl.type = 'hidden';
                subjekEl.name = '_subject';
                f.appendChild(subjekEl);
            }
            const namaMitra = document.getElementById('Nama_Mitra').value || '-';
            const namaKlien = document.getElementById('Nama_Klien_Gelar').value || '-';
            subjekEl.value = `PELAPORAN CLOSING: MITRA ${namaMitra} (KLIEN: ${namaKlien})`;

            // Cek nama bank (dari select atau ketikan manual)
            const pilihanBank = document.getElementById('Pilihan_Bank').value;
            const bankManual = document.getElementById('Nama_Bank_Lainnya').value;
            const namaBankFinal = (pilihanBank === 'LAINNYA') ? bankManual : pilihanBank;
            document.getElementById('Nama_Bank_Final').value = namaBankFinal;

            let pesanWA = `Halo Admin Media Tulisan Manusia,\nSaya bermaksud mengirimkan *FORMAT PELAPORAN CLOSING KLIEN*.\n\n*DATA MITRA (FREELANCE)*\n`;
            
            const idMitra = document.getElementById('ID_Mitra').value;
            if(idMitra) { pesanWA += `- ID Mitra: ${idMitra}\n`; }
            pesanWA += `- Nama Mitra: ${namaMitra}\n`;
            pesanWA += `- No. WhatsApp Mitra: ${document.getElementById('WhatsApp_Mitra').value}\n`;
            pesanWA += `- Nama Bank/E-Wallet: ${namaBankFinal}\n`;
            pesanWA += `- No. Rekening: ${document.getElementById('Nomor_Rekening').value}\n`;
            pesanWA += `- Atas Nama (A/N): ${document.getElementById('Nama_Pemilik').value}\n\n`;
            
            pesanWA += `*DATA KLIEN (YANG SUDAH DEAL)*\n`;
            pesanWA += `- Nama Klien: ${namaKlien}\n`;
            pesanWA += `- Instansi: ${document.getElementById('Instansi_Klien').value || '-'}\n`;
            pesanWA += `- No. WhatsApp Klien: ${document.getElementById('WhatsApp_Klien').value}\n`;
            pesanWA += `- Layanan Diambil: ${document.getElementById('Layanan_Diambil').value}\n`;
            pesanWA += `- Detail Paket: ${document.getElementById('Detail_Paket').value}\n`;
            pesanWA += `- Nilai Transaksi: ${document.getElementById('Nilai_Transaksi').value}\n`;
            pesanWA += `- Status Pembayaran: ${document.getElementById('Status_Pembayaran').value}\n\n`;
            pesanWA += `_(Catatan: Bukti interaksi klien telah saya unggah melalui sistem website)._`;
            
            const linkWhatsAppLangsung = `whatsapp://send?phone=6288294448222&text=${encodeURIComponent(pesanWA)}`;

            // Arahkan form langsung ke email yang diminta
            f.action = "https://formsubmit.co/sufyanwahyudi17@gmail.com";
            f.method = "POST";
            f.enctype = "multipart/form-data";
            f.target = "hidden-iframe-upload";
            f.submit();

            // Mencegah "nyendet": Gunakan event listener onload pada iframe 
            // agar WA baru terbuka SETELAH file benar-benar selesai diunggah.
            let disubmitSelesai = false;
            
            document.getElementById('hidden-iframe-upload').onload = function() {
                if(!disubmitSelesai) {
                    disubmitSelesai = true;
                    prosesSukses(loader, f, btn, linkWhatsAppLangsung);
                }
            };

            // Keamanan tambahan (fallback) jika iframe gagal men-trigger onload
            setTimeout(() => {
                if(!disubmitSelesai) {
                    disubmitSelesai = true;
                    prosesSukses(loader, f, btn, linkWhatsAppLangsung);
                }
            }, 8000); // Tunggu maksimal 8 detik untuk ukuran file upload yang besar
        }
    </script>
</body>
</html>
