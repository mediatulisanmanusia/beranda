<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TM Lomba Menulis Novela Nasional 2026 - PT Media Tulisan Manusia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      overflow: hidden;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      color: #1e293b;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }
    .font-serif-title {
      font-family: 'Playfair Display', serif;
    }

    /* Pola Latar Belakang Estetik Cerah */
    .bg-pattern {
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(217, 119, 6, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(14, 116, 144, 0.05) 0%, transparent 40%),
        linear-gradient(to right, rgba(203, 213, 225, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(203, 213, 225, 0.25) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    }

    /* Kanvas Interaktif Prezi Zoom */
    #canvas {
      width: 100vw;
      height: 100vh;
      position: relative;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: center center;
    }

    /* Kartu Stasiun Peta Profesional */
    .map-card {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 12px 30px -10px rgba(15, 23, 42, 0.08), 0 4px 6px -2px rgba(15, 23, 42, 0.04);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .map-card:hover {
      transform: translate(-50%, -50%) scale(1.1);
      border-color: #d97706;
      box-shadow: 0 20px 40px -10px rgba(217, 119, 6, 0.25), 0 8px 12px -4px rgba(15, 23, 42, 0.08);
      z-index: 30;
    }

    /* Garis Peta Elegan */
    .road-line {
      stroke-dasharray: 6, 6;
      animation: dashMove 20s linear infinite;
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -300; }
    }

    /* Modal Zoom */
    #content-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease 0.2s;
    }
    #content-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
      transform: scale(0.92);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.15s;
    }
    #content-overlay.active .modal-box {
      transform: scale(1);
    }
  </style>
</head>
<body class="bg-pattern">

  <!-- HEADER ATAS PROFESIONAL -->

  </div>

  <!-- MODAL ZOOM MATERI -->

          <span>✕</span> <span class="hidden sm:inline">Kembali</span>

      </div>

      <!-- Isi Materi -->
      <div id="modal-body" class="min-h-[220px] flex flex-col justify-center text-base md:text-lg leading-relaxed text-slate-700 space-y-4">
      </div>

      <!-- Navigasi Slide -->
      <div class="flex justify-between items-center mt-8 pt-4 border-t border-slate-100">
        <div id="slide-indicator" class="text-xs md:text-sm text-slate-500 font-medium">Halaman 1 dari 1</div>
        <div class="flex gap-2">
          <button id="prev-btn" onclick="changeSubSlide(-1)" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs md:text-sm font-semibold transition hidden">← Sebelumnya</button>
          <button id="next-btn" onclick="changeSubSlide(1)" class="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs md:text-sm font-bold shadow transition hidden">Selanjutnya →</button>
        </div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->

    ✨ Technical Meeting Ekspedisi • <b>lomba.mediatulisanmanusia.com</b>
  </div>

  <script>

             <li><b>Nama File:</b> <code class="bg-white px-2 py-0.5 rounded text-amber-700 font-bold border border-slate-200">Nama Penulis_Judul Novela</code></li>
           </ul>`
        ]
      },
      {
        id: 4, word: "ORISINALITAS", icon: "🤖", badgeBg: "bg-rose-100 text-rose-800",
        desktopPos: { x: 45, y: 66 }, mobilePos: { x: 74, y: 47 },
        slides: [
          `<h3 class="text-lg font-bold text-slate-900 mb-2">Keaslian Karya & Ketentuan AI (Bagian 1/2)</h3>
           <div class="space-y-3">
             <p class="p-3 bg-slate-50 rounded-xl border border-slate-200">✅ Naskah wajib karya asli, belum pernah diterbitkan ber-ISBN/QRCBN, dan tidak sedang dilombakan di tempat lain.</p>
             <div class="p-4 bg-amber-50 border-2 border-amber-300 rounded-2xl text-slate-800">
               <div class="font-extrabold text-amber-800 mb-1">🤖 Kebijakan Penggunaan AI (Maksimal 20%):</div>

             </div>

           <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 leading-relaxed">

        id: 5, word: "PENGUMPULAN", icon: "🚀", badgeBg: "bg-cyan-100 text-cyan-800",
        desktopPos: { x: 57, y: 32 }, mobilePos: { x: 26, y: 58 },
        slides: [
          `<p class="text-slate-600">Pengiriman naskah dilakukan satu pintu melalui portal resmi:</p>
           <div class="p-4 bg-amber-50 border border-amber-200 rounded-2xl text-center my-2 shadow-sm">

             <li>Isi data diri lengkap (pastikan WA & Email aktif).</li>

           </ol>`
        ]
      },
      {
        id: 6, word: "PENILAIAN", icon: "⚖️", badgeBg: "bg-purple-100 text-purple-800",
        desktopPos: { x: 69, y: 68 }, mobilePos: { x: 74, y: 68 },
        slides: [
          `<div class="space-y-2.5">

               <span><b>1. Kekuatan Alur (Plot) & Konflik</b></span>
               <span class="px-3 py-1 bg-amber-600 text-white font-bold rounded-lg">30%</span>

      },
      {
        id: 7, word: "BENEFIT", icon: "🏆", badgeBg: "bg-yellow-100 text-yellow-800",

        slides: [
          `<div class="space-y-3">
             <div class="p-3.5 bg-amber-50 border border-amber-200 rounded-2xl">
               <div class="font-bold text-amber-900">🏆 Apresiasi Pemenang (Juara 1–3 & Harapan 1–3):</div>

             </div>

      {
        id: 8, word: "DISKUSI", icon: "💬", badgeBg: "bg-emerald-100 text-emerald-800",
        desktopPos: { x: 91, y: 62 }, mobilePos: { x: 74, y: 86 },
        slides: [
          `<div class="text-center py-6 space-y-3">
             <div class="text-5xl">🙋‍♂️✨</div>
             <h3 class="font-serif-title text-2xl font-bold text-slate-900">Sesi Tanya Jawab (Q&A)</h3>
             <p class="text-slate-600 max-w-md mx-auto">Silakan gunakan fitur <b>Raise Hand</b> atau ketikkan pertanyaan di kolom <b>Chat</b>.</p>

    const canvas = document.getElementById('canvas');
    const nodesContainer = document.getElementById('nodes-container');
    const svg = document.getElementById('lines-svg');
    const overlay = document.getElementById('content-overlay');
    const topBar = document.getElementById('top-bar');
    const bottomBar = document.getElementById('bottom-bar');

    let activePoint = null;
    let currentSubSlide = 0;

    function renderRoadmap() {
      nodesContainer.innerHTML = '';
      const defs = svg.querySelector('defs').outerHTML;
      svg.innerHTML = defs;

      const w = window.innerWidth;
      const h = window.innerHeight;
      const isMobile = w < 768;

      const coords = points.map(pt => {
        const pos = isMobile ? pt.mobilePos : pt.desktopPos;
        return { x: (pos.x / 100) * w, y: (pos.y / 100) * h, pt };
      });

      let pathD = `M ${coords[0].x} ${coords[0].y}`;
      for (let i = 0; i < coords.length - 1; i++) {
        const curr = coords[i], next = coords[i + 1];
        if (isMobile) {
          const midY = (curr.y + next.y) / 2;
          pathD += ` C ${curr.x} ${midY}, ${next.x} ${midY}, ${next.x} ${next.y}`;
        } else {
          const midX = (curr.x + next.x) / 2;
          pathD += ` C ${midX} ${curr.y}, ${midX} ${next.y}, ${next.x} ${next.y}`;
        }
      }

      const roadLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      roadLine.setAttribute('d', pathD);
      roadLine.setAttribute('fill', 'none');
      roadLine.setAttribute('stroke', 'url(#roadGrad)');
      roadLine.setAttribute('stroke-width', isMobile ? '3' : '4');
      roadLine.setAttribute('stroke-linecap', 'round');
      roadLine.setAttribute('class', 'road-line');
      svg.appendChild(roadLine);

      coords.forEach(({ x, y, pt }) => {
        const card = document.createElement('div');
        card.className = 'map-card z-20 rounded-2xl p-3 md:p-4 flex flex-col items-center text-center w-28 sm:w-32 md:w-36';
        card.style.left = `${x}px`;
        card.style.top = `${y}px`;
        card.onclick = () => zoomIn(pt, x, y);

        card.innerHTML = `
          <span class="px-2 py-0.5 rounded-full text-[9px] md:text-[10px] font-extrabold uppercase tracking-wider ${pt.badgeBg} mb-2">POS 0${pt.id}</span>
          <div class="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-slate-100 flex items-center justify-center text-xl md:text-2xl mb-2 shadow-sm">${pt.icon}</div>
          <span class="font-bold text-xs md:text-sm text-slate-900 tracking-wide">${pt.word}</span>
        `;
        nodesContainer.appendChild(card);
      });
    }

    function zoomIn(pt, x, y) {
      activePoint = pt;
      currentSubSlide = 0;
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const scale = window.innerWidth < 768 ? 2.3 : 3.0;
      const tx = (cx - x) * scale;
      const ty = (cy - y) * scale;

      topBar.style.opacity = '0';
      bottomBar.style.opacity = '0';
      canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;

      updateModalContent();
      overlay.classList.add('active');
    }

    function updateModalContent() {
      document.getElementById('modal-icon').innerText = activePoint.icon;
      document.getElementById('modal-step').innerText = `STASIUN 0${activePoint.id} DARI 08`;
      document.getElementById('modal-title').innerText = activePoint.word;
      document.getElementById('modal-body').innerHTML = activePoint.slides[currentSubSlide];

      const total = activePoint.slides.length;
      document.getElementById('slide-indicator').innerText = `Halaman ${currentSubSlide + 1} dari ${total}`;
      document.getElementById('prev-btn').classList.toggle('hidden', currentSubSlide === 0);
      document.getElementById('next-btn').classList.toggle('hidden', currentSubSlide === total - 1);
    }

    function changeSubSlide(dir) {
      currentSubSlide += dir;
      updateModalContent();
    }

    function zoomOut() {
      overlay.classList.remove('active');
      canvas.style.transform = `translate(0px, 0px) scale(1)`;
      topBar.style.opacity = '1';
      bottomBar.style.opacity = '1';
    }

    window.addEventListener('resize', renderRoadmap);
    renderRoadmap();
  </script>
</body>
</html>
