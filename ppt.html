    :root {
      --gold: #f59e0b;
      --gold-light: #fcd34d;
    }
    body {
      overflow: hidden;
      background-color: #060913;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }
    .font-serif-title {
      font-family: 'Cinzel', serif;
    }

    /* Tekstur Grid Peta & Aurora Eksklusif */
    .bg-map-texture {
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(245, 158, 11, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.4) 0%, #050811 100%),
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 45px 45px, 45px 45px;
    }

    /* Kanvas Peta untuk Efek Prezi Zoom */
    #canvas {
      width: 100vw;
      height: 100vh;
      position: relative;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: center center;
    }

    /* Desain Node / Gelembung Peta Eksklusif */
    .map-node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .map-node:hover {
      transform: translate(-50%, -50%) scale(1.15);
      z-index: 30;
    }
    .node-circle {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
      box-shadow: 
        0 10px 30px -5px rgba(0, 0, 0, 0.7),
        0 0 20px -2px rgba(245, 158, 11, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }
    .map-node:hover .node-circle {
      border-color: #fbbf24;
      box-shadow: 
        0 15px 35px -5px rgba(245, 158, 11, 0.45),
        0 0 25px 2px rgba(251, 191, 36, 0.4),
        inset 0 1px 3px rgba(255, 255, 255, 0.4);
    }

    /* Cincin Putar Dekoratif di Luar Gelembung */
    .orbit-ring {
      position: absolute;
      inset: -8px;
      border-radius: 9999px;
      border: 1.5px dashed rgba(251, 191, 36, 0.35);
      animation: spinSlow 24s linear infinite;
      pointer-events: none;
    }
    .map-node:hover .orbit-ring {
      border-color: rgba(251, 191, 36, 0.85);
      animation-duration: 8s;
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Animasi Garis Peta Mengalir */
    .flow-path {
      stroke-dasharray: 10, 10;
      animation: flowDash 25s linear infinite;
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -500; }
    }

    /* Modal Konten Zoom */
    #content-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease 0.25s;
    }
    #content-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: linear-gradient(160deg, rgba(15, 23, 42, 0.95) 0%, rgba(9, 13, 24, 0.98) 100%);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 40px -10px rgba(245, 158, 11, 0.3);
      transform: scale(0.92);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.2s;
    }
    #content-overlay.active .modal-card {
      transform: scale(1);
    }
  </style>

      let pathD = `M ${coords[0].x} ${coords[0].y}`;
      for (let i = 0; i < coords.length - 1; i++) {
        const curr = coords[i];
        const next = coords[i + 1];
        if (isMobile) {
          const midY = (curr.y + next.y) / 2;
          pathD += ` C ${curr.x} ${midY}, ${next.x} ${midY}, ${next.x} ${next.y}`;
        } else {
          const midX = (curr.x + next.x) / 2;
          pathD += ` C ${midX} ${curr.y}, ${midX} ${next.y}, ${next.x} ${next.y}`;
        }
      }

      // 1. Jalur Bayangan Bawah (Glow)
      const glowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      glowPath.setAttribute('d', pathD);
      glowPath.setAttribute('fill', 'none');
      glowPath.setAttribute('stroke', 'url(#goldGrad)');
      glowPath.setAttribute('stroke-width', isMobile ? '4' : '6');
      glowPath.setAttribute('stroke-opacity', '0.25');
      glowPath.setAttribute('filter', 'url(#glow)');
      svg.appendChild(glowPath);

      // 2. Jalur Titik-Titik Mengalir (Dashed Road)
      const dashedPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      dashedPath.setAttribute('d', pathD);
      dashedPath.setAttribute('fill', 'none');
      dashedPath.setAttribute('stroke', 'url(#goldGrad)');
      dashedPath.setAttribute('stroke-width', isMobile ? '2.5' : '3.5');
      dashedPath.setAttribute('stroke-linecap', 'round');
      dashedPath.setAttribute('class', 'flow-path');
      svg.appendChild(dashedPath);

      // Render Gelembung Stasiun Peta
      coords.forEach(({ x, y, pt }) => {
        const node = document.createElement('div');
        node.className = 'map-node z-20';
        node.style.left = `${x}px`;
        node.style.top = `${y}px`;
        node.onclick = () => zoomIn(pt, x, y);

        node.innerHTML = `
          <div class="relative flex flex-col items-center">
            <div class="orbit-ring"></div>
            <!-- Badge Nomor Pos -->
            <div class=" -mb-2.5 z-10 px-2.5 py-0.5 rounded-full bg-gradient-to-r ${pt.color} text-slate-950 font-extrabold text-[10px] tracking-wider shadow">
              POS 0${pt.id}
            </div>
            <!-- Lingkaran Utama -->
            <div class="node-circle w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-full border-2 border-amber-400/50 flex flex-col items-center justify-center p-2 text-center">
              <div class="text-xl sm:text-2xl md:text-3xl mb-1 drop-shadow">${pt.icon}</div>
              <div class="font-extrabold text-[11px] sm:text-xs md:text-sm tracking-wider text-white leading-tight">${pt.word}</div>
            </div>
          </div>
        `;
        nodesContainer.appendChild(node);
      });
    }

    function zoomIn(pt, x, y) {
      activePoint = pt;
      currentSubSlide = 0;
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const scale = window.innerWidth < 768 ? 2.5 : 3.2;
      const tx = (cx - x) * scale;
      const ty = (cy - y) * scale;

      topBar.style.opacity = '0';
      bottomBar.style.opacity = '0';
      canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;

      updateModalContent();
      overlay.classList.add('active');
    }

    function updateModalContent() {
      document.getElementById('modal-icon').innerText = activePoint.icon;
      document.getElementById('modal-step').innerText = `STASIUN 0${activePoint.id} DARI 08`;
      document.getElementById('modal-title').innerText = activePoint.word;
      document.getElementById('modal-body').innerHTML = activePoint.slides[currentSubSlide];

      const total = activePoint.slides.length;
      document.getElementById('slide-indicator').innerText = `Halaman ${currentSubSlide + 1} dari ${total}`;
      document.getElementById('prev-btn').classList.toggle('hidden', currentSubSlide === 0);
      document.getElementById('next-btn').classList.toggle('hidden', currentSubSlide === total - 1);
    }

    function changeSubSlide(dir) {
      currentSubSlide += dir;
      updateModalContent();
    }

    function zoomOut() {
      overlay.classList.remove('active');
      canvas.style.transform = `translate(0px, 0px) scale(1)`;
      topBar.style.opacity = '1';
      bottomBar.style.opacity = '1';
    }

    window.addEventListener('resize', renderRoadmap);
    renderRoadmap();
  </script>
</body>
</html>
