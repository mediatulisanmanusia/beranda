name: Delete old workflow runs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  actions: write

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
          # Targetkan secara spesifik ke workflow Pages
          delete_workflow_pattern: "pages build and deployment, pages-build-deployment"
          delete_run_by_conclusion_pattern: "All"
          
