name: Delete old workflow runs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  actions: write

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
          # Paksa membaca semua file workflow di dalam repositori
          delete_workflow_pattern: ".*"
          # Paksa menghapus semua jenis status (success, failed, cancelled, dll)
          delete_run_by_conclusion_pattern: "All"
